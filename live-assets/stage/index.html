<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · 舞台</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: transparent;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaf4ff;
  }
  /* 双缓冲：两个 canvas 叠在同一位置。切动作时先把新动作的帧加载好，
     出帧后再交叉淡入——单画布直接换帧源会先清空画面，idle 每 3s 换一次
     小动作，看上去就是人物持续闪黑。 */
  #pet, #pet2 {
    position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%);
    height: 94%; width: auto; max-width: 92vw;
    /* canvas 不像 video 会自己 keep aspect：不锁比例，舞台不是 16:9 时人物会被压扁。
       360/340 是下面的统一视图尺寸，见 VIEW */
    aspect-ratio: 360 / 340;
    pointer-events: none;
    opacity: 0; transition: opacity .16s linear;
  }
  #pet.on, #pet2.on { opacity: 1; }
  /* 字幕放头顶：角色占满画面高度，底部气泡会压住身体 */
  #bubble {
    position: absolute; left: 50%; top: 2%;
    transform: translateX(-50%);
    max-width: min(64vw, 820px);
    padding: 18px 26px;
    border-radius: 22px;
    background: rgba(10, 28, 54, .74);
    border: 1px solid rgba(126, 196, 255, .38);
    box-shadow: 0 10px 34px rgba(0, 12, 32, .45);
    backdrop-filter: blur(6px);
    font-size: clamp(20px, 2.4vw, 40px);
    line-height: 1.45;
    opacity: 0; transition: opacity .28s ease;
    pointer-events: none;
  }
  #bubble.show { opacity: 1; }
  #bubbleFrom { color: #8fd0ff; font-weight: 600; margin-right: 8px; }
  /* 气泡挪到头顶后这里会撞上，队列改挂右侧中部 */
  #queue {
    position: absolute; right: 3%; top: 26%;
    min-width: 240px; max-width: 30vw;
    padding: 14px 18px 12px;
    border-radius: 16px;
    background: rgba(10, 28, 54, .58);
    border: 1px solid rgba(126, 196, 255, .28);
    backdrop-filter: blur(6px);
    font-size: clamp(14px, 1.3vw, 22px);
    opacity: 0; transition: opacity .28s ease;
    pointer-events: none;
  }
  #queue.show { opacity: 1; }
  #queue h3 {
    margin: 0 0 8px; font-size: .82em; font-weight: 600;
    letter-spacing: .08em; color: #8fd0ff;
  }
  #queueList { margin: 0; padding: 0; list-style: none; }
  #queueList li {
    padding: 3px 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; opacity: .92;
  }
  #queueList li.cur { color: #ffe3a3; opacity: 1; }
  #queueList li .by { color: #7fa6cf; font-size: .82em; margin-left: 6px; }
</style>
</head>
<body>
<!-- 画面用 canvas 逐帧绘制，素材自带 alpha，不需要任何滤镜 -->

<!-- 逐帧序列播放：素材是 shenshen 的 lossless-frame-v1 包（原图 640x360 @24fps，
     每帧一张自带 alpha 的 webp），这里用 canvas 按 24fps 抽帧绘制。
     不烘成 webm，也不改原图——只是按清单里的 crop 把画布裁到人物，
     再铺到下面的统一视图里，所以换素材只重算一次 crop。 -->
<canvas id="pet" width="360" height="340"></canvas>
<canvas id="pet2" width="360" height="340"></canvas>

<div id="bubble"><span id="bubbleFrom"></span><span id="bubbleText"></span></div>

<div id="queue">
  <h3>点歌队列</h3>
  <ul id="queueList"></ul>
</div>

<script>
(() => {
  const slots = ['pet', 'pet2'].map((id) => {
    const el = document.getElementById(id);
    return { el, ctx: el.getContext('2d'), clip: null, pos: 0, acc: 0, drawn: -1 };
  });
  const bubble = document.getElementById('bubble');
  const bubbleFrom = document.getElementById('bubbleFrom');
  const bubbleText = document.getElementById('bubbleText');
  const queueBox = document.getElementById('queue');
  const queueList = document.getElementById('queueList');

  let lastSeq = -1;
  let lastTextSeq = -1;
  let bubbleTimer = null;
  let queueSeq = -1;

  // 统一视图：所有动作都画进这个尺寸的 canvas，人物高度基本一致，
  // 切换动作时不会忽大忽小。原图 640x360 上人物只占约 235x266，两侧全是空，
  // 所以按清单里的 crop 裁到人物再铺满——原图一个字节都没改。
  const VIEW = [360, 340];

  // 素材清单：slug -> {dir, frames, loop, crop}
  let manifest = null;
  let fps = 24;
  let current = '';          // 当前动作 slug
  let active = 0;            // 正在显示的槽
  let pending = 0;           // 切动作的令牌，抢占旧的
  let endedAt = 0;           // 非循环动作播完的时刻

  // 已加载的动作：只保留最近两个（当前 + 上一个用于交叉淡入）。
  // 一帧解码后约 0.9MB（640x360 RGBA），241 帧就是 220MB，多留几个会把 OBS 撑爆。
  const cache = new Map();
  const CACHE_MAX = 2;
  const CONCURRENCY = 6;     // 同时拉多少帧，太多会把本地服务打满

  function frameUrl(dir, i) {
    const path = dir.split('/').map(encodeURIComponent).join('/');
    return '/shenshen/' + path + '/f_' + String(i + 1).padStart(4, '0') + '.webp';
  }

  function trimCache(keep) {
    for (const slug of [...cache.keys()]) {
      if (cache.size <= CACHE_MAX) break;
      if (slug === keep || slug === current || slug === 'idle') continue;
      const c = cache.get(slug);
      c.imgs.length = 0;     // 断掉引用，让解码位图被回收
      cache.delete(slug);
    }
  }

  /** 逐帧加载一个动作：并发 CONCURRENCY，首帧一到就 resolve，其余后台继续。 */
  function ensureClip(slug) {
    if (cache.has(slug)) return cache.get(slug);
    const meta = manifest.clips[slug];
    if (!meta) return null;

    const clip = {
      slug, total: meta.frames, loop: !!meta.loop,
      imgs: new Array(meta.frames), first: null, done: false,
    };
    cache.set(slug, clip);

    let next = 0;
    const pump = () => {
      if (next >= clip.total) {
        clip.done = true;
        return;
      }
      const i = next++;
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => {
        clip.imgs[i] = img;
        if (i === 0 && clip.first) clip.first();
        pump();
      };
      // 单帧失败就跳过：缺一张图不至于整段动不了
      img.onerror = pump;
      img.src = frameUrl(meta.dir, i);
    };
    for (let k = 0; k < CONCURRENCY; k++) pump();

    trimCache(slug);
    return clip;
  }

  function firstFrame(clip) {
    if (clip.imgs[0]) return Promise.resolve();
    return new Promise((resolve) => { clip.first = resolve; });
  }

  function paintSlot(slot) {
    const img = slot.clip && slot.clip.imgs[slot.pos];
    if (!img) return;
    const [sx, sy, sw, sh] = slot.clip.crop || [0, 0, 640, 360];
    // 只按高度归一：裁剪窗口高度在所有动作里是统一的，所以缩放比一致，
    // 换动作时人物不会忽大忽小；宽度超出的部分（飘散特效）直接裁掉。
    const k = VIEW[1] / sh;
    const dw = sw * k;
    const dh = sh * k;
    // 按脚底对齐，而不是按裁剪窗口居中：含特效的窗口（右上角音符、头顶道具）
    // 会把窗口撑宽，居中就变成「特效居中、人物偏一边」。
    const [fx, fy] = slot.clip.foot || [sw / 2, sh];
    slot.ctx.clearRect(0, 0, VIEW[0], VIEW[1]);
    slot.ctx.drawImage(img, sx, sy, sw, sh,
      VIEW[0] / 2 - fx * k, VIEW[1] - fy * k, dw, dh);
    slot.drawn = slot.pos;
  }

  async function setAction(action) {
    const name = action || 'idle';
    if (name === current) return;
    if (!manifest || !manifest.clips[name]) {
      // 这个名字素材包里没有（比如后端配了别的 idle 动作），退回 idle
      if (name !== 'idle' && current !== 'idle') setAction('idle');
      return;
    }
    current = name;
    endedAt = 0;
    const my = ++pending;
    const clip = ensureClip(name);
    await firstFrame(clip);
    // 加载期间又切了别的动作，这次就作废
    if (my !== pending || !manifest.clips[current]) return;

    const idx = 1 - active;
    const slot = slots[idx];
    slot.clip = clip;
    slot.pos = 0;
    slot.acc = 0;
    slot.drawn = -1;
    paintSlot(slot);
    slot.el.classList.add('on');
    slots[active].el.classList.remove('on');
    active = idx;
  }

  // 主循环：按 24fps 推进帧号，只在帧号变化时重绘（同一张图重复 drawImage 纯属浪费）
  let lastTs = 0;
  function pumpFrames(ts) {
    requestAnimationFrame(pumpFrames);
    const slot = slots[active];
    const clip = slot.clip;
    if (!clip) return;

    const dt = lastTs ? Math.min(ts - lastTs, 200) : 0;   // 切后台回来的大跳帧要压住
    lastTs = ts;
    slot.acc += dt;

    const spf = 1000 / fps;
    let moved = false;
    while (slot.acc >= spf) {
      slot.acc -= spf;
      const nextPos = slot.pos + 1;
      if (nextPos < clip.total) {
        if (clip.imgs[nextPos]) { slot.pos = nextPos; moved = true; }
        else break;                    // 该帧还没下载到，等下一轮
      } else if (clip.loop) {
        slot.pos = 0;
        moved = true;
      } else {
        // 非循环：停在最后一帧，等后端切回 idle
        if (!endedAt) endedAt = ts;
        break;
      }
    }
    if (moved || slot.drawn !== slot.pos) paintSlot(slot);

    // 软兜底：非循环动作播完 4s 还停在那儿，本地先回 idle，别让画面定格
    if (endedAt && ts - endedAt > 4000 && current !== 'idle') {
      endedAt = 0;
      setAction('idle');
    }
  }

  async function boot() {
    try {
      const res = await fetch('/stage/manifest-shenshen.json', { cache: 'no-cache' });
      manifest = await res.json();
      fps = manifest.fps || 24;
      requestAnimationFrame(pumpFrames);
      setAction('idle');
      tick();
    } catch (e) {
      console.error('[stage] 素材清单加载失败', e);
    }
  }

  function showBubble(from, text) {
    bubbleFrom.textContent = from ? from + '：' : '';
    bubbleText.textContent = text || '';
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 6500);
  }

  function renderQueue(music) {
    if (!music) return;
    const items = Array.isArray(music.queue) ? music.queue : [];
    const current = music.current || '';
    const seq = Number(music.seq ?? -1);
    if (seq === queueSeq) return;
    queueSeq = seq;

    queueList.innerHTML = '';
    let count = 0;
    if (current) {
      const li = document.createElement('li');
      li.className = 'cur';
      li.textContent = '▶ ' + current;
      queueList.appendChild(li);
      count++;
    }
    items.slice(0, 3).forEach((it) => {
      const li = document.createElement('li');
      li.textContent = it.title || '';
      if (it.by) {
        const by = document.createElement('span');
        by.className = 'by';
        by.textContent = it.by;
        li.appendChild(by);
      }
      queueList.appendChild(li);
      count++;
    });
    queueBox.classList.toggle('show', count > 0);
  }

  async function tick() {
    try {
      const res = await fetch('/stage/state', { cache: 'no-store' });
      if (res.ok) {
        const state = await res.json();
        if (state.enabled === false) {
          slots.forEach((s) => { s.el.style.display = 'none'; });
        } else {
          slots.forEach((s) => { s.el.style.display = ''; });
          if (state.seq !== lastSeq) {
            lastSeq = state.seq;
            setAction(state.action);
          }
          if (state.textSeq !== lastTextSeq && state.text) {
            lastTextSeq = state.textSeq;
            showBubble(state.from, state.text);
          }
          renderQueue(state.music);
        }
      }
    } catch (e) {
      /* 后端重启中，下一轮再试 */
    }
    setTimeout(tick, 800);
  }

  boot();

})();
</script>
</body>
</html>
